name: Sweep stale relay objects

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - name: Remove relay objects older than one day
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +%s)"
          aws s3api list-objects-v2 \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket "$R2_BUCKET" \
            --prefix 'relay/' \
            --output json \
            | jq -r --argjson cutoff "$cutoff" '
                (.Contents // [])[]
                | select((.LastModified | fromdateiso8601) < $cutoff)
                | .Key
              ' \
            | while IFS= read -r key; do
                [[ "$key" =~ ^relay/[A-Za-z0-9._-]+$ ]]
                aws s3 rm --only-show-errors \
                  --endpoint-url "$R2_ENDPOINT" \
                  "s3://$R2_BUCKET/$key"
              done
