name: Ephemeral private release
run-name: Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Opaque build identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ephemeral-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Load controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Join private network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
          retry: 1
          timeout: 30s
          ping: ${{ secrets.PRIVATE_IP }}
          use-cache: false

      - name: Prepare private endpoint
        env:
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
          PRIVATE_IP: ${{ secrets.PRIVATE_IP }}
        run: bash scripts/prepare-private-endpoint.sh

      - name: Prepare source
        env:
          GITEA_SOURCE_TOKEN: ${{ secrets.GITEA_SOURCE_TOKEN }}
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
        run: bash scripts/fetch-source.sh

      - name: Package and publish extension
        env:
          BUNDLED_API_TOKEN: ${{ secrets.BUNDLED_API_TOKEN }}
          BUNDLED_COLLECTION_ID: ${{ secrets.BUNDLED_COLLECTION_ID }}
          BUNDLED_ORGANIZATION_ID: ${{ secrets.BUNDLED_ORGANIZATION_ID }}
          BUNDLED_PROXY_URLS: ${{ secrets.BUNDLED_PROXY_URLS }}
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_PACKAGE_TOKEN }}
          REPOSITORY_API_URL: ${{ secrets.REPOSITORY_API_URL }}
          REQUIRE_BUNDLED_CONFIG: "true"
        run: bash scripts/release-extension.sh

      - name: Remove temporary data
        if: always()
        run: bash scripts/cleanup.sh

  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_ID: ${{ inputs.build_id }}
      IMAGE_REF: ${{ secrets.REGISTRY_IMAGE }}:${{ inputs.build_id }}
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
    steps:
      - name: Load controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Join private network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
          retry: 1
          timeout: 30s
          ping: ${{ secrets.PRIVATE_IP }}
          use-cache: false

      - name: Prepare private endpoint
        env:
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
          PRIVATE_IP: ${{ secrets.PRIVATE_IP }}
        run: bash scripts/prepare-private-endpoint.sh

      - name: Prepare source
        env:
          GITEA_SOURCE_TOKEN: ${{ secrets.GITEA_SOURCE_TOKEN }}
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
        run: bash scripts/fetch-source.sh

      - name: Authenticate internal registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITEA_PACKAGE_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin >/dev/null

      - name: Build and deliver service image
        run: bash scripts/build-image.sh

      - name: Remove temporary data
        if: always()
        run: bash scripts/cleanup.sh

  deploy:
    needs: [extension, service]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILD_ID: ${{ inputs.build_id }}
      IMAGE_REF: ${{ secrets.REGISTRY_IMAGE }}:${{ inputs.build_id }}
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
    steps:
      - name: Load controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Join private network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
          retry: 1
          timeout: 30s
          ping: ${{ secrets.PRIVATE_IP }}
          use-cache: false

      - name: Prepare private endpoint
        env:
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
          PRIVATE_IP: ${{ secrets.PRIVATE_IP }}
        run: bash scripts/prepare-private-endpoint.sh

      - name: Prepare source
        env:
          GITEA_SOURCE_TOKEN: ${{ secrets.GITEA_SOURCE_TOKEN }}
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
        run: bash scripts/fetch-source.sh

      - name: Deploy and verify service
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
          N100_SSH_HOST: ${{ secrets.N100_SSH_HOST }}
          N100_SSH_KNOWN_HOSTS: ${{ secrets.N100_SSH_KNOWN_HOSTS }}
          N100_SSH_PRIVATE_KEY: ${{ secrets.N100_SSH_PRIVATE_KEY }}
          N100_SSH_USER: ${{ secrets.N100_SSH_USER }}
          REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          SERVICE_COMPOSE_NAME: ${{ secrets.SERVICE_COMPOSE_NAME }}
          SERVICE_IMAGE_VARIABLE: ${{ secrets.SERVICE_IMAGE_VARIABLE }}
          TAILSCALE_COMPOSE_NAME: ${{ secrets.TAILSCALE_COMPOSE_NAME }}
          TS_DEVICE_TAG: ${{ secrets.TS_DEVICE_TAG }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          TS_TAILNET: "-"
        run: bash scripts/deploy-service.sh

      - name: Publish release
        env:
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_PACKAGE_TOKEN }}
          REPOSITORY_API_URL: ${{ secrets.REPOSITORY_API_URL }}
        run: bash scripts/publish-release.sh

      - name: Remove temporary data
        if: always()
        run: bash scripts/cleanup.sh
