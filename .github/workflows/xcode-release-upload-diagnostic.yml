name: XCode release upload diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.actor == vars.TRUSTED_ACTOR
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
          use-cache: false
      - name: Probe bounded upload and clean test attachment
        env:
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_ZCODE_RELEASE_TOKEN }}
        shell: bash
        run: bash scripts/probe-xcode-release-upload.sh
