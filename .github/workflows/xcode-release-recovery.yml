name: XCode encrypted release recovery
run-name: XCode recovery ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: Gitea HTTPS URL of the ZCode source repository
        required: true
        type: string
      source_ref:
        description: Exact 40-character Gitea commit SHA to build
        required: true
        type: string
      recovery_public_key:
        description: Base64 PEM public key for one-time encrypted delivery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xcode-encrypted-recovery-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.actor == vars.TRUSTED_ACTOR
    runs-on: macos-14
    timeout-minutes: 120
    env:
      BUILD_ID: ${{ inputs.source_ref }}
      BUILD_TARGET: macos-arm64
      PACKAGE_NAME: xcode-recovery.tar.gz
      R2_PREFIX: xcode/encrypted-recovery/${{ inputs.source_ref }}
      SOURCE_REPO_URL: ${{ inputs.source_repo_url }}
      ZCODE_ENV: production
      ZCODE_ENABLE_MAC_SIGN: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Checkout controller files only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Install pinned pnpm
        shell: bash
        run: npm install --global pnpm@10.33.2

      - name: Prepare ephemeral runner paths
        shell: bash
        run: bash scripts/normalize-runner-paths.sh

      - name: Verify macOS ARM runner
        shell: bash
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64

      - name: Join tailnet temporarily
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
          use-cache: false

      - name: Fetch exact source revision
        shell: bash
        env:
          GITEA_SOURCE_TOKEN: ${{ secrets.GITEA_SOURCE_TOKEN }}
          GITEA_CUA_HELPER_TOKEN: ${{ secrets.GITEA_ZCODE_RELEASE_TOKEN }}
        run: bash scripts/fetch-source.sh

      - name: Build ZCode macOS ARM package
        shell: bash
        run: bash scripts/run-private-build.sh

      - name: Package build output
        shell: bash
        run: bash scripts/package-output.sh

      - name: Encrypt package for the local recipient
        shell: bash
        env:
          RECOVERY_PUBLIC_KEY: ${{ inputs.recovery_public_key }}
        run: node scripts/xcode-recovery-transport.mjs encrypt

      - name: Deliver through R2
        shell: bash
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/deliver-r2.sh

      - name: Publish private delivery pointer
        shell: bash
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_ZCODE_RELEASE_TOKEN }}
        run: node scripts/xcode-recovery-transport.mjs pointer

      - name: Remove temporary data
        if: always()
        shell: bash
        run: bash scripts/cleanup.sh
