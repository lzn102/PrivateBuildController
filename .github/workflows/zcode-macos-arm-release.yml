name: XCode macOS ARM Release
run-name: XCode macOS ARM Release ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: Gitea HTTPS URL of the XCode source repository
        required: true
        type: string
      source_ref:
        description: Exact 40-character Gitea commit SHA to build and release
        required: true
        type: string
      release_tag:
        description: Optional tag; defaults to v<source package version>
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: xcode-macos-arm-release-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.actor == vars.TRUSTED_ACTOR
    runs-on: macos-14
    timeout-minutes: 120
    env:
      BUILD_ID: ${{ inputs.source_ref }}
      BUILD_TARGET: macos-arm64
      PACKAGE_NAME: xcode-macos-arm64-release-placeholder.tar.gz
      SOURCE_REPO_URL: ${{ inputs.source_repo_url }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ZCODE_ENV: production
      ZCODE_PREVIEW_IDENTITY: "0"
      ZCODE_ENABLE_MAC_SIGN: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Checkout controller files only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Install pinned pnpm
        shell: bash
        run: npm install --global pnpm@10.33.2

      - name: Prepare ephemeral runner paths
        shell: bash
        run: bash scripts/normalize-runner-paths.sh

      - name: Verify macOS ARM runner
        shell: bash
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64

      - name: Join tailnet temporarily
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
          use-cache: false

      - name: Fetch exact source revision
        shell: bash
        env:
          GITEA_SOURCE_TOKEN: ${{ secrets.GITEA_SOURCE_TOKEN }}
        run: bash scripts/fetch-source.sh

      - name: Build XCode macOS ARM package
        shell: bash
        run: bash scripts/run-private-build.sh

      - name: Publish Gitea Release
        shell: bash
        env:
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_ZCODE_RELEASE_TOKEN }}
        run: node scripts/publish-gitea-release.mjs

      - name: Remove temporary data
        if: always()
        shell: bash
        run: bash scripts/cleanup.sh
